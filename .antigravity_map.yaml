project_name: "Chetan Dabhi — Portfolio"
last_updated: "2026-09-17"
overview: >
  A React + Vite single-page portfolio website with a hacker/terminal aesthetic,
  featuring client-side routing (react-router-dom), live GitHub repo fetching,
  a typewriter-animated About terminal, skills listing, contact form,
  dark/light theme toggle, and a full-stack Task Manager (Practical 6)
  wired to a Node/Express/MongoDB backend via CORS-enabled REST API.

modules:
  # ── Agent Rules ────────────────────────────────────────────────
  - path: "GEMINI.md"
    purpose: "Agent rules file for Gemini-based agents — enforces Read-First and Update-on-Write protocols using .antigravity_map.yaml."
    exports: []
    dependencies:
      - ".antigravity_map.yaml"

  - path: "AGENTS.md"
    purpose: "Agent rules file for non-Gemini agents (Copilot, Cursor, Cline) — identical to GEMINI.md for cross-agent compatibility."
    exports: []
    dependencies:
      - ".antigravity_map.yaml"

  # ── Build & Config ──────────────────────────────────────────────
  - path: "package.json"
    purpose: "Defines project metadata, scripts (dev/build/preview), and dependencies (React 19, react-router-dom, Vite 8)."
    exports: []
    dependencies: []

  - path: "vite.config.js"
    purpose: "Vite build configuration — enables the React plugin."
    exports:
      - "default (defineConfig)"
    dependencies: []

  - path: "index.html"
    purpose: "HTML entry point — mounts #root, loads Fira Code from Google Fonts, includes SEO meta tags."
    exports: []
    dependencies:
      - "src/main.jsx"

  # ── Application Entry ───────────────────────────────────────────
  - path: "src/main.jsx"
    purpose: "React DOM entry — wraps <App /> in StrictMode and BrowserRouter."
    exports: []
    dependencies:
      - "src/index.css"
      - "src/App.jsx"

  - path: "src/index.css"
    purpose: "Global stylesheet — terminal/hacker design tokens, component styles (header, navbar, terminal, projects, spinner, error panel, footer, task-form, task-card, toast), animations, dark/light theme variables."
    exports: []
    dependencies: []

  - path: "src/App.jsx"
    purpose: "Root component — holds student data, skills array, dark/light theme state, applies body theme styles, composes Header → NavBar → Routes (/, /projects, /tasks, /contact, *) → Footer."
    exports:
      - "App"
    dependencies:
      - "src/components/Header.jsx"
      - "src/components/NavBar.jsx"
      - "src/components/Home.jsx"
      - "src/components/Projects.jsx"
      - "src/components/Tasks.jsx"
      - "src/components/Contact.jsx"
      - "src/components/NotFound.jsx"
      - "src/components/Footer.jsx"

  # ── Practical 6 — API Service Layer ─────────────────────────────
  - path: "src/services/api.js"
    purpose: "Central API service — single BASE_URL constant and five CRUD functions (getTasks, createTask, updateTask, deleteTask) using fetch."
    exports:
      - "getTasks"
      - "createTask"
      - "updateTask"
      - "deleteTask"
    dependencies: []

  # ── Page-Level Components ───────────────────────────────────────
  - path: "src/components/Home.jsx"
    purpose: "Home route — composes <About /> and <Skills /> sections on the landing page."
    exports:
      - "Home"
    dependencies:
      - "src/components/About.jsx"
      - "src/components/Skills.jsx"

  - path: "src/components/Projects.jsx"
    purpose: "Projects route — fetches GitHub repos from api.github.com, manages loading/error/search state, renders Spinner, ErrorMessage, or RepoList."
    exports:
      - "Projects"
    dependencies:
      - "src/components/Spinner.jsx"
      - "src/components/ErrorMessage.jsx"
      - "src/components/RepoList.jsx"

  - path: "src/components/Tasks.jsx"
    purpose: "Practical 6 — Task Manager page orchestrator handling all CRUD state, loading/error per operation, toast notifications, confirmation dialog on delete, and re-fetch after every write."
    exports:
      - "Tasks"
    dependencies:
      - "src/services/api.js"
      - "src/components/Spinner.jsx"
      - "src/components/ErrorMessage.jsx"
      - "src/components/TaskForm.jsx"
      - "src/components/TaskList.jsx"
      - "src/components/Toast.jsx"

  - path: "src/components/Contact.jsx"
    purpose: "Contact route — textarea with character count, focus-triggered help tip, and alert-based submit."
    exports:
      - "Contact"
    dependencies: []

  # ── UI Components ───────────────────────────────────────────────
  - path: "src/components/Header.jsx"
    purpose: "Site header — displays student name (prop-colored) and subtitle tagline."
    exports:
      - "Header"
    dependencies: []

  - path: "src/components/NavBar.jsx"
    purpose: "Navigation bar — NavLinks to /, /projects, /tasks, /contact with active-state styling, plus a dark/light theme toggle button."
    exports:
      - "NavBar"
    dependencies: []

  - path: "src/components/About.jsx"
    purpose: "About section — animated terminal emulator that types out bio commands/outputs line-by-line with typewriter effect, blinking cursor, and auto-scroll."
    exports:
      - "About"
    dependencies: []

  - path: "src/components/Skills.jsx"
    purpose: "Skills section — renders a list of skill strings received via props."
    exports:
      - "Skills"
    dependencies: []

  - path: "src/components/RepoList.jsx"
    purpose: "Renders a grid of GitHub repository cards with terminal-styled title bars, star count, language tag, and git-clone link."
    exports:
      - "RepoList"
    dependencies: []

  - path: "src/components/TaskForm.jsx"
    purpose: "Practical 6 — Terminal-styled create/edit form with title, description, priority fields, git-themed submit/cancel buttons, and per-operation loading state."
    exports:
      - "TaskForm"
    dependencies: []

  - path: "src/components/TaskList.jsx"
    purpose: "Practical 6 — Renders terminal-styled task cards with priority badges, completed toggle, edit/delete actions, and empty state."
    exports:
      - "TaskList"
    dependencies: []

  - path: "src/components/Toast.jsx"
    purpose: "Practical 6 — Auto-dismissing toast notification component (3s timeout) with success/error variants and slide animation."
    exports:
      - "Toast"
    dependencies: []

  - path: "src/components/Spinner.jsx"
    purpose: "Loading indicator — terminal-styled panel with animated dots and a scanline bar."
    exports:
      - "Spinner"
    dependencies: []

  - path: "src/components/ErrorMessage.jsx"
    purpose: "Error display — terminal-styled error panel with [ERROR] label, message, hint, and a retry button."
    exports:
      - "ErrorMessage"
    dependencies: []

  - path: "src/components/Footer.jsx"
    purpose: "Site footer — displays dynamic © year and author name."
    exports:
      - "Footer"
    dependencies: []

  - path: "src/components/NotFound.jsx"
    purpose: "404 catch-all route — red glowing 404 heading with 'ROUTE NOT FOUND' message."
    exports:
      - "NotFound"
    dependencies: []

  # ── Static Assets ───────────────────────────────────────────────
  - path: "public/kali-logo.png"
    purpose: "Kali Linux logo image asset (unused in current components)."
    exports: []
    dependencies: []

  # ── Practical 5 + 6 — Task Manager REST API (MongoDB Edition) ──
  - path: "task-manager-api/package.json"
    purpose: "Node project config — defines Express, Mongoose, cors, and dotenv dependencies with start/dev scripts."
    exports: []
    dependencies: []

  - path: "task-manager-api/.env"
    purpose: "Environment variables — MongoDB Atlas connection string and port (git-ignored)."
    exports: []
    dependencies: []

  - path: "task-manager-api/.env.example"
    purpose: "Template for .env — redacted credentials for collaborators."
    exports: []
    dependencies: []

  - path: "task-manager-api/.gitignore"
    purpose: "Excludes node_modules and .env from version control."
    exports: []
    dependencies: []

  - path: "task-manager-api/config/db.js"
    purpose: "MongoDB connection module — connects to Atlas via Mongoose, logs host on success, exits on failure."
    exports:
      - "connectDB"
    dependencies: []

  - path: "task-manager-api/models/Task.js"
    purpose: "Mongoose Task schema — 5 fields (title, description, completed, priority, createdAt) with required/enum/default constraints and pre-save trim hook."
    exports:
      - "Task (model)"
    dependencies: []

  - path: "task-manager-api/server.js"
    purpose: "Express REST API — CORS-enabled, MongoDB-backed CRUD (GET/GET:id/POST/PUT/DELETE /tasks), Mongoose ODM, request logging, Content-Type validation, ObjectId validation, structured error handling."
    exports: []
    dependencies:
      - "task-manager-api/config/db.js"
      - "task-manager-api/models/Task.js"
      - "task-manager-api/package.json"
