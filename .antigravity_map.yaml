project_name: "Chetan Dabhi — Portfolio"
last_updated: "2026-09-24"
overview: >
  A React + Vite single-page portfolio website with a hacker/terminal aesthetic,
  featuring client-side routing, live GitHub repo fetching, a full-stack 
  Task Manager (Practical 6 & 7) wired to a Node/Express/MongoDB backend via 
  CORS-enabled REST API with JWT-based Authentication, and route-based code
  splitting with React.lazy() and Suspense (Practical 8).

modules:
  # ── Agent Rules ────────────────────────────────────────────────
  - path: "GEMINI.md"
    purpose: "Agent rules file for Gemini-based agents — enforces Read-First and Update-on-Write protocols using .antigravity_map.yaml."
    exports: []
    dependencies:
      - ".antigravity_map.yaml"

  - path: "AGENTS.md"
    purpose: "Agent rules file for non-Gemini agents (Copilot, Cursor, Cline) — identical to GEMINI.md for cross-agent compatibility."
    exports: []
    dependencies:
      - ".antigravity_map.yaml"

  # ── Build & Config ──────────────────────────────────────────────
  - path: "package.json"
    purpose: "Defines project metadata, scripts (dev/build/preview), and dependencies (React 19, react-router-dom, Vite 8)."
    exports: []
    dependencies: []

  - path: "vite.config.js"
    purpose: "Vite build configuration — enables the React plugin."
    exports:
      - "default (defineConfig)"
    dependencies: []

  - path: "index.html"
    purpose: "HTML entry point — mounts #root, loads Fira Code from Google Fonts, includes SEO meta tags."
    exports: []
    dependencies:
      - "src/main.jsx"

  # ── Application Entry ───────────────────────────────────────────
  - path: "src/main.jsx"
    purpose: "React DOM entry — wraps <App /> in StrictMode and BrowserRouter."
    exports: []
    dependencies:
      - "src/index.css"
      - "src/App.jsx"

  - path: "src/index.css"
    purpose: "Global stylesheet — terminal/hacker design tokens, component styles, animations, dark/light theme variables, and auth-form styling."
    exports: []
    dependencies: []

  - path: "src/App.jsx"
    purpose: "Root component — holds student data, theme state, applies body theme styles, composes Header → NavBar → Suspense(LazyFallback) → Routes (/, /projects, /tasks, /contact, /login, *) → Footer; lazy-loads route components via React.lazy() for code splitting (Practical 8)."
    exports:
      - "App"
    dependencies:
      - "src/components/Header.jsx"
      - "src/components/NavBar.jsx"
      - "src/components/Home.jsx"
      - "src/components/Projects.jsx"
      - "src/components/Tasks.jsx"
      - "src/components/Contact.jsx"
      - "src/components/Login.jsx"
      - "src/components/NotFound.jsx"
      - "src/components/Footer.jsx"
      - "src/components/LazyFallback.jsx"
      - "src/services/api.js"

  # ── Practical 6 & 7 — API Service Layer ─────────────────────────
  - path: "src/services/api.js"
    purpose: "Central API service — manages JWT token in localStorage, handles 401 redirects, and provides CRUD & auth fetch functions."
    exports:
      - "getToken"
      - "setToken"
      - "clearToken"
      - "isAuthenticated"
      - "register"
      - "login"
      - "getMe"
      - "getTasks"
      - "createTask"
      - "updateTask"
      - "deleteTask"
    dependencies: []

  # ── Page-Level Components ───────────────────────────────────────
  - path: "src/components/Home.jsx"
    purpose: "Home route — composes <About /> and <Skills /> sections on the landing page."
    exports:
      - "Home"
    dependencies:
      - "src/components/About.jsx"
      - "src/components/Skills.jsx"

  - path: "src/components/Projects.jsx"
    purpose: "Projects route — fetches GitHub repos from api.github.com, manages loading/error/search state, renders Spinner, ErrorMessage, or RepoList."
    exports:
      - "Projects"
    dependencies:
      - "src/components/Spinner.jsx"
      - "src/components/ErrorMessage.jsx"
      - "src/components/RepoList.jsx"

  - path: "src/components/Tasks.jsx"
    purpose: "Practical 7 — Task Manager page orchestrator handling CRUD state, loading/error, toast notifications, and listening for auth:expired event."
    exports:
      - "Tasks"
    dependencies:
      - "src/services/api.js"
      - "src/components/Spinner.jsx"
      - "src/components/ErrorMessage.jsx"
      - "src/components/TaskForm.jsx"
      - "src/components/TaskList.jsx"
      - "src/components/Toast.jsx"

  - path: "src/components/Contact.jsx"
    purpose: "Contact route — textarea with character count, focus-triggered help tip, and alert-based submit."
    exports:
      - "Contact"
    dependencies: []

  - path: "src/components/Login.jsx"
    purpose: "Practical 7 — Terminal-styled authentication form for login and registration, interacting with auth endpoints."
    exports:
      - "Login"
    dependencies:
      - "src/services/api.js"

  # ── UI Components ───────────────────────────────────────────────
  - path: "src/components/Header.jsx"
    purpose: "Site header — displays student name (prop-colored) and subtitle tagline."
    exports:
      - "Header"
    dependencies: []

  - path: "src/components/NavBar.jsx"
    purpose: "Navigation bar — NavLinks with active-state styling, auth toggle (Login/Logout), and a dark/light theme toggle."
    exports:
      - "NavBar"
    dependencies: []

  - path: "src/components/About.jsx"
    purpose: "About section — animated terminal emulator that types out bio commands/outputs line-by-line with typewriter effect."
    exports:
      - "About"
    dependencies: []

  - path: "src/components/Skills.jsx"
    purpose: "Skills section — renders a list of skill strings received via props."
    exports:
      - "Skills"
    dependencies: []

  - path: "src/components/RepoList.jsx"
    purpose: "Renders a grid of GitHub repository cards with terminal-styled title bars, star count, language tag, and git-clone link."
    exports:
      - "RepoList"
    dependencies: []

  - path: "src/components/TaskForm.jsx"
    purpose: "Practical 6 — Terminal-styled create/edit form with title, description, priority fields, git-themed submit/cancel buttons."
    exports:
      - "TaskForm"
    dependencies: []

  - path: "src/components/TaskList.jsx"
    purpose: "Practical 6 — Renders terminal-styled task cards with priority badges, completed toggle, edit/delete actions."
    exports:
      - "TaskList"
    dependencies: []

  - path: "src/components/Toast.jsx"
    purpose: "Practical 6 — Auto-dismissing toast notification component (3s timeout) with success/error variants."
    exports:
      - "Toast"
    dependencies: []

  - path: "src/components/Spinner.jsx"
    purpose: "Loading indicator — terminal-styled panel with animated dots and a scanline bar."
    exports:
      - "Spinner"
    dependencies: []

  - path: "src/components/ErrorMessage.jsx"
    purpose: "Error display — terminal-styled error panel with [ERROR] label, message, hint, and a retry button."
    exports:
      - "ErrorMessage"
    dependencies: []

  - path: "src/components/Footer.jsx"
    purpose: "Site footer — displays dynamic © year and author name."
    exports:
      - "Footer"
    dependencies: []

  - path: "src/components/NotFound.jsx"
    purpose: "404 catch-all route — red glowing 404 heading with 'ROUTE NOT FOUND' message."
    exports:
      - "NotFound"
    dependencies: []

  - path: "src/components/LazyFallback.jsx"
    purpose: "Practical 8 — Terminal-styled Suspense fallback UI with animated progress bar and scanline, rendered while lazy-loaded route chunks download."
    exports:
      - "LazyFallback"
    dependencies: []

  # ── Practical 8 — Performance Documentation ──────────────────────
  - path: "docs/performance-comparison.md"
    purpose: "Practical 8 — Before/after build output comparison, metrics table, and analysis explaining code splitting impact."
    exports: []
    dependencies: []

  # ── Static Assets ───────────────────────────────────────────────
  - path: "public/kali-logo.png"
    purpose: "Kali Linux logo image asset (unused in current components)."
    exports: []
    dependencies: []

  # ── Practical 5, 6, 7 — Task Manager REST API ───────────────────
  - path: "task-manager-api/package.json"
    purpose: "Node project config — defines Express, Mongoose, cors, dotenv, bcryptjs, jsonwebtoken dependencies."
    exports: []
    dependencies: []

  - path: "task-manager-api/.env"
    purpose: "Environment variables — MongoDB URI, PORT, and JWT_SECRET."
    exports: []
    dependencies: []

  - path: "task-manager-api/.env.example"
    purpose: "Template for .env variables."
    exports: []
    dependencies: []

  - path: "task-manager-api/.gitignore"
    purpose: "Excludes node_modules and .env from version control."
    exports: []
    dependencies: []

  - path: "task-manager-api/config/db.js"
    purpose: "MongoDB connection module — connects to Atlas via Mongoose."
    exports:
      - "connectDB"
    dependencies: []

  - path: "task-manager-api/models/Task.js"
    purpose: "Mongoose Task schema — validates title, description, completed, priority, createdAt."
    exports:
      - "Task (model)"
    dependencies: []

  - path: "task-manager-api/models/User.js"
    purpose: "Mongoose User schema — validates name, email, and password."
    exports:
      - "User (model)"
    dependencies: []

  - path: "task-manager-api/middleware/auth.js"
    purpose: "JWT authentication middleware — verifies token from Authorization header."
    exports:
      - "authMiddleware"
    dependencies: []

  - path: "task-manager-api/middleware/validate.js"
    purpose: "Input validation middleware — checks request body for register, login, and tasks endpoints."
    exports:
      - "validateRegister"
      - "validateLogin"
      - "validateTask"
    dependencies: []

  - path: "task-manager-api/routes/auth.js"
    purpose: "Express router for authentication — handles /register, /login, and /me endpoints."
    exports:
      - "router"
    dependencies:
      - "task-manager-api/models/User.js"
      - "task-manager-api/middleware/auth.js"
      - "task-manager-api/middleware/validate.js"

  - path: "task-manager-api/server.js"
    purpose: "Express REST API — handles middleware pipeline, connects DB, routes auth and tasks, handles global errors."
    exports: []
    dependencies:
      - "task-manager-api/config/db.js"
      - "task-manager-api/models/Task.js"
      - "task-manager-api/routes/auth.js"
      - "task-manager-api/middleware/auth.js"
      - "task-manager-api/middleware/validate.js"
