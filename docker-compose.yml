# ============================================================
# Practical 11 — Docker Compose Orchestration
# Starts frontend, backend, and MongoDB with one command:
#   docker-compose up --build
# ============================================================

services:
  # ── MongoDB ─────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: taskdb-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db          # Named volume for data persistence
    networks:
      - app-network

  # ── Backend (Node/Express API) ──────────────────────────
  backend:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: taskdb-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - PORT=5000
      - JWT_SECRET=chetan_dabhi_jwt_secret_2026_practical7
    depends_on:
      - mongodb
    networks:
      - app-network

  # ── Frontend (React + Vite) ────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskdb-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# ── Shared Network ──────────────────────────────────────
networks:
  app-network:
    driver: bridge

# ── Named Volume (data persists across restarts) ────────
volumes:
  mongo-data:
